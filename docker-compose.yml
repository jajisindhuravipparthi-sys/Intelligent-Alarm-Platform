services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cognitive-alarm-backend
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognitive-alarm-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped